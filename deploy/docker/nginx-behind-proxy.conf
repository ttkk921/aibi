# 已有 nginx 反向代理到 app 容器（配合 compose.behind-proxy.yaml）。
# 证书和 80→443 跳转由已有的 nginx 管（宝塔：网站 → SSL）；把下面两段放进站点的 server { } 里，替换原来的 location /。
# 宝塔：存成 /www/server/panel/vhost/nginx/extension/<域名>/bi_proxy.conf 即可（站点配置会 include 这个目录），不用改站点配置。
# ^~ 让整站都走反向代理，不被站点自带的 js/css/图片正则 location 截走；宝塔的证书验证在 server 级处理，不受影响。

# Excel 上传；一天的明细约 15MB。
client_max_body_size 100m;

location ^~ / {
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 大的导入、导出要跑几分钟。
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
}
